<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Varal Veloz</title>
  <meta name="description" content="Em cima do carro, com um gancho na mão, pegue roupas dos varais, colecione peças raras e monte o visual do personagem. Protótipo de jogo da 3R Studios." />
  <script type="module" crossorigin src="./assets/index-Bi3x5y4D.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Dfc0Pcul.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="haul"><span id="haulCount">0</span> <span id="haulWord">peças</span></div>
    <div id="timer">90</div>
    <div id="crosshair"></div>
    <div id="toasts"></div>
    <div id="warn" class="hidden">ABAIXA!</div>
    <div id="hint">Clique para lançar o gancho · Espaço (ou segure o botão) para abaixar</div>
    <button id="duckBtn" class="touch-only">Abaixar</button>
    <button id="pauseBtn" aria-label="Pausar">II</button>
  </div>

  <section id="pause" class="screen hidden">
    <h2>Pausado</h2>
    <div class="buttons">
      <button id="resume">Continuar</button>
      <button id="quit" class="alt">Encerrar a volta</button>
    </div>
  </section>

  <section id="menu" class="screen">
    <h1>Varal Veloz</h1>
    <p>Em cima do carro, gancho na mão: pegue as roupas dos varais antes que a volta acabe. Cuidado com os fios baixos!</p>
    <div id="levels"></div>
    <div class="buttons">
      <button id="play">Jogar</button>
      <button id="menuWardrobe" class="alt">Guarda-roupa</button>
    </div>
    <button id="privacyAds" class="link hidden">Privacidade dos anúncios</button>
  </section>

  <section id="end" class="screen hidden">
    <h2>Fim da volta!</h2>
    <div id="endSummary"></div>
    <div id="rewardBox" class="hidden">
      <button id="rewardBtn" class="reward">Ganhar 1 peça rara</button>
      <small>Assista a um anúncio curto</small>
    </div>
    <div id="endList" class="cards"></div>
    <div class="buttons">
      <button id="again">Jogar de novo</button>
      <button id="endWardrobe" class="alt">Vestir</button>
    </div>
  </section>

  <section id="wardrobe" class="screen side hidden">
    <h2>Guarda-roupa</h2>
    <div id="slotTabs"></div>
    <div id="wardItems" class="cards"></div>
    <div class="buttons">
      <button id="wardPlay">Jogar</button>
    </div>
  </section>

</body>
</html>
