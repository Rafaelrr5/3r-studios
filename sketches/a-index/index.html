<!doctype html>
<html lang="en" data-p="ink">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3R Studios — A · Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--fg)}
body{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 40px;border-bottom:1px solid var(--line)}
header nav{display:flex;gap:28px}
header nav a{position:relative}
header nav a::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--fg);transform:scaleX(0);transform-origin:right;transition:transform .35s cubic-bezier(.7,0,.2,1)}
header nav a:hover::after{transform:scaleX(1);transform-origin:left}
.hero{padding:9vh 40px 5vh;position:relative}
.word{font-weight:900;font-size:clamp(56px,13.6vw,240px);line-height:.8;letter-spacing:-.045em;display:flex;overflow:hidden;cursor:default;user-select:none}
.word span{display:inline-block;transform:translateY(105%);animation:up 1s cubic-bezier(.2,.9,.1,1) forwards;transition:font-variation-settings .5s cubic-bezier(.2,.9,.1,1)}
.word span.gap{width:.22em}
@keyframes up{to{transform:none}}
.sub{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;margin-top:6vh;align-items:end}
.sub p{font-size:20px;line-height:1.35;max-width:30ch}
.sub p b{font-weight:600;background:linear-gradient(var(--acc),var(--acc)) 0 88%/100% .18em no-repeat}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
.list{border-top:1px solid var(--fg);margin:0 40px}
.row{display:grid;grid-template-columns:70px 1.2fr 1.6fr 120px 40px;align-items:center;gap:24px;padding:26px 0;border-bottom:1px solid var(--line);position:relative;cursor:pointer}
.row::before{content:"";position:absolute;inset:0 -40px;background:var(--fg);transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1}
.row:hover::before{transform:scaleY(1)}
.row:hover{color:var(--bg)}
.row h3{font-size:clamp(28px,3.4vw,52px);font-weight:700;letter-spacing:-.03em;transition:font-variation-settings .45s,transform .45s cubic-bezier(.2,.9,.1,1)}
.row:hover h3{font-variation-settings:"wdth" 125;transform:translateX(10px)}
.row .l{font-size:17px;opacity:.8}
.arrow{font-size:26px;transition:transform .45s cubic-bezier(.2,.9,.1,1)}
.row:hover .arrow{transform:rotate(-45deg);color:var(--acc)}
.detail{grid-column:2/5;display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.7,0,.2,1)}
.detail>div{overflow:hidden}
.row.open .detail{grid-template-rows:1fr}
.detail p{font-size:18px;line-height:1.45;max-width:60ch;padding-top:18px}
.tags{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
.tags span{border:1px solid currentColor;border-radius:99px;padding:4px 10px}
#peek{position:fixed;left:0;top:0;width:280px;height:190px;pointer-events:none;z-index:5;border-radius:6px;background:var(--acc);color:var(--bg);padding:18px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transform:translate3d(-999px,0,0) scale(.6);transition:opacity .25s,scale .25s;will-change:transform}
#peek.on{opacity:1}
#peek .big{font-weight:900;font-size:64px;letter-spacing:-.05em;line-height:.8}
footer{display:flex;justify-content:space-between;padding:60px 40px 30px}
.marq{overflow:hidden;border-block:1px solid var(--line);margin-top:10vh;white-space:nowrap}
.marq div{display:inline-block;padding:18px 0;animation:mq 30s linear infinite;font-weight:800;font-size:44px;letter-spacing:-.03em}
.marq div i{font-style:normal;color:var(--acc);padding:0 24px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.word span{transform:none}}
</style>
</head>
<body>
<header class="mono"><a href="#">3R Studios</a><nav><a href="#">Work</a><a href="#">Principles</a><a href="#">GitHub ↗</a></nav><span><span class="dot"></span>Juiz de Fora · BR</span></header>
<section class="hero">
  <h1 class="word" id="word" aria-label="3R Studios"></h1>
  <div class="sub">
    <p class="mono">[ 05 open projects ]<br>Commercial-grade, published in the open.</p>
    <p>Tools I build to run real work, released with the code, <b>not a demo</b>.</p>
    <p class="mono" style="text-align:right">Scroll ↓</p>
  </div>
</section>
<section class="list" id="list"></section>
<div class="marq"><div id="mq"></div></div>
<footer class="mono"><span>© 2026 3R Studios</span><span>github.com/Rafaelrr5</span></footer>
<div id="peek"><span class="mono" id="pk-l"></span><span class="big" id="pk-n"></span></div>
<script>
const W=document.getElementById('word');
[..."3R STUDIOS"].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00A0':c;if(c===' ')s.className='gap';s.style.animationDelay=(i*55)+'ms';W.appendChild(s)});
// width ripple following the cursor over the wordmark
const spans=[...W.querySelectorAll('span')];
W.addEventListener('pointermove',e=>{spans.forEach(s=>{const r=s.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2));s.style.fontVariationSettings=`"wdth" ${Math.max(62,125-d*.35)|0}`})});
W.addEventListener('pointerleave',()=>spans.forEach(s=>s.style.fontVariationSettings=''));
const L=document.getElementById('list');
PROJECTS.forEach((p,i)=>{L.insertAdjacentHTML('beforeend',`<article class="row" data-i="${i}"><span class="mono">${String(i+1).padStart(2,'0')}</span><h3>${p.name}</h3><span class="l">${p.line}</span><span class="mono">${p.lang}</span><span class="arrow">→</span><div class="detail"><div><p>${p.body}</p><div class="tags mono">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div></div></article>`)});
L.addEventListener('click',e=>{const r=e.target.closest('.row');if(r)r.classList.toggle('open')});
document.getElementById('mq').innerHTML=Array(2).fill(PROJECTS.map(p=>p.name+'<i>✳</i>').join('')).join('');
// cursor-follow peek, lerped in rAF, transform only
const pk=document.getElementById('peek');let tx=0,ty=0,x=0,y=0,live=false;
L.addEventListener('pointerover',e=>{const r=e.target.closest('.row');if(!r)return;const p=PROJECTS[r.dataset.i];document.getElementById('pk-n').textContent=p.lang.slice(0,2).toUpperCase();document.getElementById('pk-l').textContent=p.year+' · '+p.tags[0];pk.classList.add('on')});
L.addEventListener('pointerleave',()=>pk.classList.remove('on'));
addEventListener('pointermove',e=>{tx=e.clientX+24;ty=e.clientY-95;if(!live){live=true;requestAnimationFrame(tick)}});
function tick(){x+=(tx-x)*.16;y+=(ty-y)*.16;const v=Math.max(-12,Math.min(12,(tx-x)*.15));pk.style.transform=`translate3d(${x}px,${y}px,0) rotate(${v}deg)`;if(Math.abs(tx-x)+Math.abs(ty-y)>.3)requestAnimationFrame(tick);else live=false}
</script>
</body>
</html>
